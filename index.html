<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Para Lorenit</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            text-align: center;
            font-family: Georgia, serif;
            min-height: 100vh;
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        #t1 {
            font-size: clamp(20px, 5vw, 28px);
            font-weight: bold;
            margin: 8px 0;
        }

        #t2 {
            font-size: clamp(16px, 4vw, 22px);
            font-style: italic;
            margin: 4px 0;
        }
    </style>
</head>

<body>
    <canvas id="c" width="800" height="800"></canvas>
    <p id="t1">Feliz Cumpleaños, Lorenit</p>
    <p id="t2">Te amo por siempre &lt;3</p>

    <script>
        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 800, 800);
        ctx.lineWidth = 2; ctx.lineCap = 'round';

        const S = 0.6; // escala de la flor (súbela o bájala si la quieres más grande/pequeña)
        const colores = ['white', '#ffcb7d', '#FFA216', '#ff6b9d', '#c77dff', '#4cc9f0', '#80ed99', '#ff4d4d'];

        let x = 0, y = 0, head = 0, down = true, poly = null;
        const toC = (px, py) => [400 + px * S, 400 - py * S];

        function circle(r, ext) {
            const rad = Math.PI / 180;
            const cx = x + r * Math.cos((head + 90) * rad);
            const cy = y + r * Math.sin((head + 90) * rad);
            const a0 = head - 90, steps = Math.max(8, Math.ceil(ext / 3));
            for (let k = 1; k <= steps; k++) {
                const a = (a0 + ext * k / steps) * rad;
                const nx = cx + r * Math.cos(a), ny = cy + r * Math.sin(a);
                if (down) {
                    ctx.beginPath();
                    ctx.moveTo(...toC(x, y)); ctx.lineTo(...toC(nx, ny));
                    ctx.stroke();
                }
                x = nx; y = ny;
                if (poly) poly.push([x, y]);
            }
            head += ext;
        }
        const left = a => { head += a; };
        function dibujo(a, n) { circle(5 + n, 60); left(a); circle(5 + n, 60); }

        function paso(i) {
            ctx.strokeStyle = colores[Math.floor(i / 15) % colores.length];
            poly = [[x, y]];
            dibujo(90, i / 2);
            ctx.beginPath();
            poly.forEach(([px, py], k) => {
                const [a, b] = toC(px, py);
                k ? ctx.lineTo(a, b) : ctx.moveTo(a, b);
            });
            ctx.closePath(); ctx.fillStyle = '#000'; ctx.fill();
            poly = null;
            dibujo(160, i * 1.2); down = false;
            dibujo(0, 0); dibujo(90, i / 2); down = true;
        }

        let i = 0;
        (function loop() {
            for (let k = 0; k < 3 && i < 360; k++) paso(i++);
            if (i < 360) requestAnimationFrame(loop);
        })();

        // Texto que cambia de color
        let h = 0;
        setInterval(() => {
            h = (h + 3) % 360;
            document.getElementById('t1').style.color = `hsl(${h},80%,65%)`;
            document.getElementById('t2').style.color = `hsl(${(h + 180) % 360},80%,65%)`;
        }, 50);
    </script>
</body>

</html>
