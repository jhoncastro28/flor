<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Para Lorenit</title>
    <style>
        :root {
            color-scheme: dark;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            text-align: center;
            font-family: Georgia, serif;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .mensaje {
            position: fixed;
            z-index: 1;
            right: 16px;
            bottom: clamp(28px, 8vh, 72px);
            left: 16px;
            pointer-events: none;
        }

        #t1,
        #t2 {
            color: #fff;
            margin: 0;
        }

        #t1 {
            font-size: clamp(20px, 5vw, 28px);
            font-weight: bold;
        }

        #t2 {
            font-size: clamp(16px, 4vw, 22px);
            font-style: italic;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div class="mensaje">
        <p id="t1">Feliz Cumpleaños, Lorenit</p>
        <p id="t2">Te amo por siempre &lt;3</p>
    </div>

    <script>
        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        ctx.lineWidth = 2; ctx.lineCap = 'round';

        const colores = ['white', '#ffcb7d', '#FFA216', '#ff6b9d', '#c77dff', '#4cc9f0', '#80ed99', '#ff4d4d'];

        let scale = 1, centerX = 0, centerY = 0;
        let x = 0, y = 0, head = 0, down = true, poly = null;
        const toC = (px, py) => [centerX + px * scale, centerY - py * scale];

        function ajustarCanvas() {
            const ratio = window.devicePixelRatio || 1;
            cv.width = Math.floor(window.innerWidth * ratio);
            cv.height = Math.floor(window.innerHeight * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            scale = Math.min(window.innerWidth, window.innerHeight) / 800 * 1.05;
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight * 0.42;
        }

        function circle(r, ext) {
            const rad = Math.PI / 180;
            const cx = x + r * Math.cos((head + 90) * rad);
            const cy = y + r * Math.sin((head + 90) * rad);
            const a0 = head - 90, steps = Math.max(8, Math.ceil(ext / 3));
            for (let k = 1; k <= steps; k++) {
                const a = (a0 + ext * k / steps) * rad;
                const nx = cx + r * Math.cos(a), ny = cy + r * Math.sin(a);
                if (down) {
                    ctx.beginPath();
                    ctx.moveTo(...toC(x, y)); ctx.lineTo(...toC(nx, ny));
                    ctx.stroke();
                }
                x = nx; y = ny;
                if (poly) poly.push([x, y]);
            }
            head += ext;
        }
        const left = a => { head += a; };
        function dibujo(a, n) { circle(5 + n, 60); left(a); circle(5 + n, 60); }

        function paso(i) {
            ctx.strokeStyle = colores[Math.floor(i / 15) % colores.length];
            poly = [[x, y]];
            dibujo(90, i / 2);
            ctx.beginPath();
            poly.forEach(([px, py], k) => {
                const [a, b] = toC(px, py);
                k ? ctx.lineTo(a, b) : ctx.moveTo(a, b);
            });
            ctx.closePath(); ctx.fillStyle = '#000'; ctx.fill();
            poly = null;
            dibujo(160, i * 1.2); down = false;
            dibujo(0, 0); dibujo(90, i / 2); down = true;
        }

        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        let i = 0, ultimoPaso = 0;
        function loop(timestamp) {
            requestAnimationFrame(loop);
            if (timestamp - ultimoPaso < 45) return;
            ultimoPaso = timestamp;
            if (i === 0) {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                x = 0; y = 0; head = 0; down = true;
            }
            paso(i++);
            if (i >= 360) i = 0;
        }
        requestAnimationFrame(loop);
    </script>
</body>

</html>
